name: "Grocy (Latest)"
version: "1.0.4"
slug: "grocy_latest"
description: "Grocy avec image Docker à jour"
startup: services
boot: auto
init: false

arch:
  - aarch64
  - amd64
  - armv7
  - i386

ports:
  9283/tcp: 9283

ports_description:
  9283/tcp: "Interface web Grocy"

map:
  - addon_config:rw

options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem

schema:
  ssl: bool
  certfile: str
  keyfile: str
